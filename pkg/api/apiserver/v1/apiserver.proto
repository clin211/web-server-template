syntax = "proto3";

package apiserver.v1;

import "apiserver/v1/healthz.proto";
import "apiserver/v1/user.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/clin211/gin-enterprise-template/pkg/api/apiserver/v1;v1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "API Server v1"
    version: "1.0"
    description: "基于 gin-enterprise-template 的通用后端 API 服务：\n- JWT 用户认证\n- 用户基础管理\n- RESTful 资源接口\n- OpenTelemetry 可观测性"
    contact: {
      name: "gin-enterprise-template 项目"
      url: "https://github.com/clin211/gin-enterprise-template"
      email: "767425412lin@gmail.com"
    }
  }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        name: "Authorization"
        in: IN_HEADER
        description: "JWT Bearer token，格式为 Bearer <token>；refresh-token 操作使用 refresh token，其余受保护操作使用 access token"
      }
    }
  }
};

service APIServer {
  rpc Healthz(google.protobuf.Empty) returns (HealthzResponse) {
    option (google.api.http) = {get: "/healthz"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "健康检查"
      description: "检查服务是否健康运行"
      tags: "服务治理"
      responses: {
        key: "200"
        value: {
          description: "服务健康状态"
          schema: { json_schema: { ref: ".apiserver.v1.HealthzResponseEnvelope" } }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "统一错误响应"
          schema: { json_schema: { ref: ".apiserver.v1.APIError" } }
        }
      }
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "用户登录"
      description: "用户使用用户名和密码进行登录认证"
      tags: "用户认证"
      responses: {
        key: "200"
        value: {
          description: "登录成功，返回访问令牌与刷新令牌"
          schema: { json_schema: { ref: ".apiserver.v1.LoginResponseEnvelope" } }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "统一错误响应"
          schema: { json_schema: { ref: ".apiserver.v1.APIError" } }
        }
      }
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (LoginResponse) {
    option (google.api.http) = {
      put: "/v1/auth/refresh-token"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "刷新令牌"
      description: "使用现有令牌刷新获取新的访问令牌"
      tags: "用户认证"
      security: {
        security_requirement: { key: "BearerAuth" value: {} }
      }
      responses: {
        key: "200"
        value: {
          description: "刷新成功，返回新的访问令牌与刷新令牌"
          schema: { json_schema: { ref: ".apiserver.v1.LoginResponseEnvelope" } }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "统一错误响应"
          schema: { json_schema: { ref: ".apiserver.v1.APIError" } }
        }
      }
    };
  }

  rpc Info(InfoRequest) returns (InfoResponse) {
    option (google.api.http) = {get: "/v1/auth/info"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "获取当前用户信息"
      description: "使用当前访问令牌获取当前用户的脱敏资料"
      tags: "用户认证"
      security: {
        security_requirement: { key: "BearerAuth" value: {} }
      }
      responses: {
        key: "200"
        value: {
          description: "当前登录用户的脱敏资料"
          schema: { json_schema: { ref: ".apiserver.v1.InfoResponseEnvelope" } }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "统一错误响应"
          schema: { json_schema: { ref: ".apiserver.v1.APIError" } }
        }
      }
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "退出登录"
      description: "撤销当前用户已签发的访问令牌和刷新令牌"
      tags: "用户认证"
      security: {
        security_requirement: { key: "BearerAuth" value: {} }
      }
      responses: {
        key: "200"
        value: {
          description: "退出成功"
          schema: { json_schema: { ref: ".apiserver.v1.LogoutResponseEnvelope" } }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "统一错误响应"
          schema: { json_schema: { ref: ".apiserver.v1.APIError" } }
        }
      }
    };
  }

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "创建用户"
      description: "创建一个新的用户"
      tags: "用户管理"
      responses: {
        key: "200"
        value: {
          description: "创建成功，返回新用户 ID"
          schema: { json_schema: { ref: ".apiserver.v1.CreateUserResponseEnvelope" } }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "统一错误响应"
          schema: { json_schema: { ref: ".apiserver.v1.APIError" } }
        }
      }
    };
  }

  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {get: "/v1/users/{userID}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "获取用户"
      description: "根据用户 ID 获取用户信息"
      tags: "用户管理"
      security: {
        security_requirement: { key: "BearerAuth" value: {} }
      }
      responses: {
        key: "200"
        value: {
          description: "用户信息"
          schema: { json_schema: { ref: ".apiserver.v1.GetUserResponseEnvelope" } }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "统一错误响应"
          schema: { json_schema: { ref: ".apiserver.v1.APIError" } }
        }
      }
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      put: "/v1/users/{userID}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "更新用户"
      description: "根据用户 ID 更新用户信息"
      tags: "用户管理"
      security: {
        security_requirement: { key: "BearerAuth" value: {} }
      }
      responses: {
        key: "200"
        value: {
          description: "更新成功"
          schema: { json_schema: { ref: ".apiserver.v1.UpdateUserResponseEnvelope" } }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "统一错误响应"
          schema: { json_schema: { ref: ".apiserver.v1.APIError" } }
        }
      }
    };
  }

  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {delete: "/v1/users/{userID}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "删除用户"
      description: "根据用户 ID 删除用户"
      tags: "用户管理"
      security: {
        security_requirement: { key: "BearerAuth" value: {} }
      }
      responses: {
        key: "200"
        value: {
          description: "删除成功"
          schema: { json_schema: { ref: ".apiserver.v1.DeleteUserResponseEnvelope" } }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "统一错误响应"
          schema: { json_schema: { ref: ".apiserver.v1.APIError" } }
        }
      }
    };
  }

  rpc ListUsers(ListUserRequest) returns (ListUserResponse) {
    option (google.api.http) = {get: "/v1/users"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "列表用户"
      description: "获取所有用户的列表"
      tags: "用户管理"
      security: {
        security_requirement: { key: "BearerAuth" value: {} }
      }
      responses: {
        key: "200"
        value: {
          description: "用户列表与分页游标"
          schema: { json_schema: { ref: ".apiserver.v1.ListUserResponseEnvelope" } }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "统一错误响应"
          schema: { json_schema: { ref: ".apiserver.v1.APIError" } }
        }
      }
    };
  }

  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      put: "/v1/users/{userID}/change-password"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "修改密码"
      description: "当前用户修改自己的密码"
      tags: "用户管理"
      security: {
        security_requirement: { key: "BearerAuth" value: {} }
      }
      responses: {
        key: "200"
        value: {
          description: "修改成功"
          schema: { json_schema: { ref: ".apiserver.v1.ChangePasswordResponseEnvelope" } }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "统一错误响应"
          schema: { json_schema: { ref: ".apiserver.v1.APIError" } }
        }
      }
    };
  }
}
