// ActionEnvelope represents an empty successful mutation.
message ActionEnvelope {
  int32 code = 1;
  string message = 2;
  google.protobuf.Empty data = 3;
}

// TaskService documents the independently executed task APIs.
service TaskService {
  rpc SubmitReport(ReportParams) returns (Task) {
    option (google.api.http) = {
      post: "/v1/reports"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "SubmitReport"
      description: "Live RBAC and owner authorization required. Required Idempotency-Key header, at most 128 characters."
      tags: "Tasks"
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
      responses: {
        key: "202"
        value: {
          description: "Success"
          schema: {
            json_schema: {ref: ".apiserver.v1.TaskEnvelope"}
          }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "Error"
          schema: {
            json_schema: {ref: ".apiserver.v1.APIError"}
          }
        }
      }
    };
  }
  rpc ListTasks(TaskListRequest) returns (TaskList) {
    option (google.api.http) = {get: "/v1/tasks"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "ListTasks"
      description: "Live RBAC and owner authorization required."
      tags: "Tasks"
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
      responses: {
        key: "200"
        value: {
          description: "Success"
          schema: {
            json_schema: {ref: ".apiserver.v1.TaskListEnvelope"}
          }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "Error"
          schema: {
            json_schema: {ref: ".apiserver.v1.APIError"}
          }
        }
      }
    };
  }
  rpc GetTask(TaskIDRequest) returns (Task) {
    option (google.api.http) = {get: "/v1/tasks/{task_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "GetTask"
      description: "Live RBAC and owner authorization required."
      tags: "Tasks"
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
      responses: {
        key: "200"
        value: {
          description: "Success"
          schema: {
            json_schema: {ref: ".apiserver.v1.TaskEnvelope"}
          }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "Error"
          schema: {
            json_schema: {ref: ".apiserver.v1.APIError"}
          }
        }
      }
    };
  }
  rpc TaskAttempts(TaskIDRequest) returns (AttemptList) {
    option (google.api.http) = {get: "/v1/tasks/{task_id}/attempts"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "TaskAttempts"
      description: "Live RBAC and owner authorization required."
      tags: "Tasks"
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
      responses: {
        key: "200"
        value: {
          description: "Success"
          schema: {
            json_schema: {ref: ".apiserver.v1.AttemptListEnvelope"}
          }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "Error"
          schema: {
            json_schema: {ref: ".apiserver.v1.APIError"}
          }
        }
      }
    };
  }
  rpc CancelTask(TaskIDRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/v1/tasks/{task_id}/cancel"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "CancelTask"
      description: "Live RBAC and owner authorization required."
      tags: "Tasks"
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
      responses: {
        key: "200"
        value: {
          description: "Success"
          schema: {
            json_schema: {ref: ".apiserver.v1.ActionEnvelope"}
          }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "Error"
          schema: {
            json_schema: {ref: ".apiserver.v1.APIError"}
          }
        }
      }
    };
  }
  rpc RetryTask(TaskIDRequest) returns (Task) {
    option (google.api.http) = {post: "/v1/tasks/{task_id}/retry"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "RetryTask"
      description: "Live RBAC and owner authorization required. Required Idempotency-Key header, at most 128 characters."
      tags: "Tasks"
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
      responses: {
        key: "202"
        value: {
          description: "Success"
          schema: {
            json_schema: {ref: ".apiserver.v1.TaskEnvelope"}
          }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "Error"
          schema: {
            json_schema: {ref: ".apiserver.v1.APIError"}
          }
        }
      }
    };
  }
  rpc DownloadResult(TaskIDRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {get: "/v1/tasks/{task_id}/result"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "DownloadResult"
