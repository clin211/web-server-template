      tags: "Tasks"
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
      produces: "text/csv"
      responses: {
        key: "200"
        value: {
          description: "Authorized CSV result"
          schema: {
            json_schema: {type: STRING}
          }
        }
      }
      responses: {
        key: "default"
        value: {
          description: "Error"
          schema: {
            json_schema: {ref: ".apiserver.v1.APIError"}
          }
        }
      }
    };
  }
  rpc ReportNotifications(google.protobuf.Empty) returns (NotificationList) {
    option (google.api.http) = {get: "/v1/report-notifications"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "ReportNotifications"
