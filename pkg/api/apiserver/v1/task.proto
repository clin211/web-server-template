  }
  rpc GetSchedule(ScheduleIDRequest) returns (Schedule) {
    option (google.api.http) = {get: "/v1/schedules/{schedule_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "GetSchedule"
      description: "Live RBAC and owner authorization required."
      tags: "Tasks"
      security: {
        security_requirement: {
          key: "BearerAuth"
          value: {}
        }
      }
      responses: {
        key: "200"
        value: {
          description: "Success"
