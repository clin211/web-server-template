  rpc UpdateSchedule(ScheduleUpdateRequest) returns (Schedule) {
    option (google.api.http) = {
      put: "/v1/schedules/{schedule_id}"
      body: "input"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "UpdateSchedule"
