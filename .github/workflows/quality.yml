name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buf
        env:
          BUF_VERSION: 1.57.2
          BUF_SHA256: 644e6fa4a62afc2b0d425d3ac9538d2f512947c0f2e82fc95c41a5eab6729414
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/bin"
          buf_path="${bin_dir}/buf"
          mkdir -p "${bin_dir}"
          curl --fail --location --silent --show-error \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            --output "${buf_path}"
          echo "${BUF_SHA256}  ${buf_path}" | sha256sum --check -
          chmod +x "${buf_path}"
          echo "${bin_dir}" >> "${GITHUB_PATH}"
          "${buf_path}" --version

      - name: Set up Protoc
        env:
          PROTOC_VERSION: "30.0"
          PROTOC_SHA256: 2fbbc1818463d7e6d93c19a8dea839e663ca5f8579a52ef78c7688188335fa6c
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}.zip"
          protoc_dir="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}"
          curl --fail --location --silent --show-error \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" \
            --output "${archive}"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum --check -
          unzip -q "${archive}" -d "${protoc_dir}"
          echo "${protoc_dir}/bin" >> "${GITHUB_PATH}"
          "${protoc_dir}/bin/protoc" --version

      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --version

      - name: Install generation tools
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.29.0
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.29.0
          go install github.com/onexstack/protoc-gen-defaults@v0.0.2
          go install github.com/favadi/protoc-go-inject-tag@v1.4.0
          go install github.com/google/wire/cmd/wire@v0.6.0

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Determine lint baseline
        id: lint-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            base="HEAD~1"
          fi
          echo "rev=$base" >> "$GITHUB_OUTPUT"

      - name: Verify
        run: make verify LINT_NEW_FROM_REV="${{ steps.lint-base.outputs.rev }}"

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Build container
        run: docker build --file Dockerfile --build-arg OS=linux --build-arg ARCH=amd64 .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start integration dependencies
        run: make integration.up
      - name: Run integration tests
        env:
          TEST_POSTGRES_DSN: postgres://postgres:integration-postgres@127.0.0.1:55432/enterprise_template_test?sslmode=disable
          TEST_KAFKA_BROKERS: 127.0.0.1:29092
          TEST_KAFKA_TOPIC: events
          TEST_KAFKA_DLQ_TOPIC: events.dlq
        run: make integration.test
      - name: Run startup smoke test
        run: make integration.smoke
      - name: Stop integration dependencies
        if: always()
        run: make integration.down
