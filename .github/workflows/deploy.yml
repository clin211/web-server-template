name: Publish tested image
on:
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: 'Successful Quality Gate run on release'
        required: true
      commit:
        description: 'Full commit SHA tested by that run'
        required: true
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Validate the quality run and commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.quality_run_id }}
          COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$REPO/actions/runs/$RUN_ID" > run.json
          jq --exit-status --arg sha "$COMMIT" '.conclusion=="success" and .head_sha==$sha and .head_branch=="release" and .path==".github/workflows/quality.yml" and .event=="push"' run.json
      - uses: actions/download-artifact@v6
        with:
          name: tested-image-${{ inputs.commit }}
          run-id: ${{ inputs.quality_run_id }}
          github-token: ${{ github.token }}
          path: image
      - name: Verify and publish the tested bytes
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          cd image
          [[ "$(cat commit)" == "$COMMIT" ]]
          sha256sum --check image.tar.sha256
          docker load --input image.tar
          image_id="$(cat image.id)"
          [[ "$(docker image inspect --format '{{.Id}}' "$image_id")" == "$image_id" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")" == "$COMMIT" ]]
          registry="ghcr.io/${REPO,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
          docker tag "$image_id" "$registry:$COMMIT"
          docker push "$registry:$COMMIT"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$registry:$COMMIT")"
          printf 'commit=%s\nimage=%s\nquality_run=%s\n' "$COMMIT" "$digest" '${{ inputs.quality_run_id }}' > release-manifest.txt
          cat release-manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: release-manifest-${{ inputs.commit }}
          path: image/release-manifest.txt
          if-no-files-found: error
