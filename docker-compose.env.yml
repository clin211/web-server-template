services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_template}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-54321}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/pgdata}:/var/lib/postgresql/data
      - ./configs/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gin-enterprise-template_net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:-dev-only-redis}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-redis}
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - ./data/redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gin-enterprise-template_net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4327:4327" # OTLP gRPC 接收，与 app 配置一致
      - "4328:4328" # OTLP HTTP 接收（可选）
      - "13133:13133" # Collector 健康检查
    volumes:
      - ./configs/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      # Collector 镜像为 distroless，不包含 /bin/sh 或 curl；使用内置校验命令。
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gin-enterprise-template_net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19092}
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gin-enterprise-template_net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  topic-init:
    image: redpandadata/redpanda:v24.1.1
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rpk topic create events --brokers redpanda:9092 || true
        rpk topic create events.dlq --brokers redpanda:9092 || true
        rpk topic create inbound-events --brokers redpanda:9092 || true
        rpk topic create inbound-events.dlq --brokers redpanda:9092 || true
    networks:
      - gin-enterprise-template_net

networks:
  gin-enterprise-template_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
