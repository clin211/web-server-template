global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: enterprise-api
    static_configs: [{targets: ['api:5558']}]
  - job_name: enterprise-worker
    static_configs: [{targets: ['worker:5560']}]
  - job_name: enterprise-scheduler
    static_configs: [{targets: ['scheduler:5561']}]
  - job_name: kafka-exporter
    static_configs: [{targets: ['kafka-exporter:9308']}]
